name: Build iOS App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Auto Patch Swift Errors
        run: |
          # 1. Add CGPoint Codable conformance globally
          cat << 'EOF' > Core/CGPointCodable.swift
          import CoreGraphics
          import Foundation

          extension CGPoint: Codable {
              public init(from decoder: Decoder) throws {
                  var container = try decoder.unkeyedContainer()
                  let x = try container.decode(Double.self)
                  let y = try container.decode(Double.self)
                  self.init(x: x, y: y)
              }
              public func encode(to encoder: Encoder) throws {
                  var container = encoder.unkeyedContainer()
                  try container.encode(x)
                  try container.encode(y)
              }
          }
          EOF

          # 2. Fix duplicate CameraMode and GridType in UI components
          python3 -c "
          for path in ['UI/Components/ShutterButton.swift', 'Models/PhotoData.swift']:
              try:
                  with open(path, 'r') as f:
                      content = f.read()
                  import re
                  content = re.sub(r'enum\s+CameraMode[^{]*\{[^}]*\}', '', content)
                  content = re.sub(r'enum\s+GridType[^{]*\{[^}]*\}', '', content)
                  with open(path, 'w') as f:
                      f.write(content)
              except Exception as e:
                  pass
          "

          # 3. Ensure SettingsManager singleton exists
          python3 -c "
          import os
          target = 'Managers/SettingsManager.swift'
          if os.path.exists(target):
              with open(target, 'r') as f:
                  content = f.read()
              if 'static let shared' not in content:
                  content = content.replace('class SettingsManager: ObservableObject {', 'class SettingsManager: ObservableObject {\n    public static let shared = SettingsManager()\n')
                  with open(target, 'w') as f:
                      f.write(content)
          "

      - name: Generate Clean Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: LuminaCamera
          options:
            bundleIdPrefix: com.rahat
            deploymentTarget:
              iOS: "17.0"
          targets:
            LuminaCamera:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: App
                - path: Core
                - path: Extensions
                - path: Managers
                - path: Models
                - path: Resources
                - path: UI
                - path: ViewModels
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.rahat.luminacamera
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
          EOF
          brew install xcodegen
          xcodegen generate

      - name: Build Application
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          xcodebuild build \
            -project LuminaCamera.xcodeproj \
            -scheme LuminaCamera \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r LuminaCamera.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaCamera-IPA
          path: LuminaCamera.ipa
