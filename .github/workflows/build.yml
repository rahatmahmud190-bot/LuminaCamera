name: Build iOS App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Clean Camera App Source
        run: |
          rm -rf CleanApp
          mkdir -p CleanApp

          cat << 'EOF' > CleanApp/App.swift
          import SwiftUI
          import AVFoundation
          import CoreImage
          import CoreImage.CIFilterBuiltins

          @main
          struct LuminaCameraApp: App {
              var body: some Scene {
                  WindowGroup {
                      CameraRootView()
                          .preferredColorScheme(.dark)
                  }
              }
          }

          struct CameraRootView: View {
              @StateObject private var camera = CameraController()
              @State private var selectedFilter: String = "Normal"
              let filters = ["Normal", "Antigravity", "Mono", "Vivid", "Noir"]

              var body: some View {
                  ZStack {
                      Color.black.ignoresSafeArea()

                      if let image = camera.currentFrame {
                          Image(decorative: image, scale: 1.0, orientation: .up)
                              .resizable()
                              .aspectRatio(contentMode: .fill)
                              .ignoresSafeArea()
                      } else {
                          VStack(spacing: 12) {
                              ProgressView()
                                  .tint(.white)
                              Text("Starting Camera...")
                                  .foregroundColor(.gray)
                                  .font(.subheadline)
                          }
                      }

                      VStack {
                          HStack {
                              Text("Lumina Camera")
                                  .font(.headline)
                                  .foregroundColor(.white)
                              Spacer()
                              Circle()
                                  .fill(Color.green)
                                  .frame(width: 8, height: 8)
                          }
                          .padding(.horizontal, 24)
                          .padding(.top, 16)

                          Spacer()

                          ScrollView(.horizontal, showsIndicators: false) {
                              HStack(spacing: 12) {
                                  ForEach(filters, id: \.self) { item in
                                      Button(action: {
                                          selectedFilter = item
                                          camera.activeFilter = item
                                      }) {
                                          Text(item)
                                              .font(.system(size: 13, weight: .semibold))
                                              .padding(.horizontal, 14)
                                              .padding(.vertical, 8)
                                              .background(selectedFilter == item ? Color.white : Color.white.opacity(0.2))
                                              .foregroundColor(selectedFilter == item ? .black : .white)
                                              .clipShape(Capsule())
                                      }
                                  }
                              }
                              .padding(.horizontal, 20)
                          }
                          .padding(.bottom, 16)

                          HStack(spacing: 40) {
                              RoundedRectangle(cornerRadius: 8)
                                  .stroke(Color.white.opacity(0.6), lineWidth: 1.5)
                                  .frame(width: 44, height: 44)
                                  .overlay(
                                      Image(systemName: "photo.on.rectangle")
                                          .foregroundColor(.white)
                                  )

                              Button(action: {
                                  camera.capturePhoto()
                              }) {
                                  ZStack {
                                      Circle()
                                          .stroke(Color.white, lineWidth: 4)
                                          .frame(width: 74, height: 74)
                                      Circle()
                                          .fill(Color.white)
                                          .frame(width: 62, height: 62)
                                  }
                              }

                              Button(action: {
                                  camera.toggleCamera()
                              }) {
                                  Circle()
                                      .fill(Color.white.opacity(0.2))
                                      .frame(width: 44, height: 44)
                                      .overlay(
                                          Image(systemName: "camera.rotate")
                                              .foregroundColor(.white)
                                      )
                              }
                          }
                          .padding(.bottom, 34)
                      }
                  }
                  .onAppear {
                      camera.start()
                  }
              }
          }

          class CameraController: NSObject, ObservableObject, AVCaptureVideoDataOutputSampleBufferDelegate {
              @Published var currentFrame: CGImage?
              var activeFilter: String = "Normal"
              private let session = AVCaptureSession()
              private let context = CIContext()
              private var currentPosition: AVCaptureDevice.Position = .back

              func start() {
                  AVCaptureDevice.requestAccess(for: .video) { granted in
                      guard granted else { return }
                      DispatchQueue.global(qos: .userInitiated).async { [weak self] in
                          self?.setupSession()
                          self?.session.startRunning()
                      }
                  }
              }

              func toggleCamera() {
                  currentPosition = (currentPosition == .back) ? .front : .back
                  DispatchQueue.global(qos: .userInitiated).async { [weak self] in
                      self?.session.stopRunning()
                      self?.setupSession()
                      self?.session.startRunning()
                  }
              }

              func capturePhoto() {
                  let generator = UINotificationFeedbackGenerator()
                  generator.notificationOccurred(.success)
              }

              private func setupSession() {
                  session.beginConfiguration()
                  session.inputs.forEach { session.removeInput($0) }
                  session.outputs.forEach { session.removeOutput($0) }

                  guard let device = AVCaptureDevice.default(.builtInWideAngleCamera, for: .video, position: currentPosition),
                        let input = try? AVCaptureDeviceInput(device: device),
                        session.canAddInput(input) else {
                      session.commitConfiguration()
                      return
                  }
                  session.addInput(input)

                  let output = AVCaptureVideoDataOutput()
                  output.setSampleBufferDelegate(self, queue: DispatchQueue(label: "camera.queue"))
                  if session.canAddOutput(output) {
                      session.addOutput(output)
                  }
                  session.commitConfiguration()
              }

              func captureOutput(_ output: AVCaptureOutput, didOutput sampleBuffer: CMSampleBuffer, from connection: AVCaptureConnection) {
                  guard let pixelBuffer = CMSampleBufferGetImageBuffer(sampleBuffer) else { return }
                  var ciImage = CIImage(cvPixelBuffer: pixelBuffer)

                  if activeFilter == "Mono" {
                      ciImage = ciImage.applyingFilter("CIPhotoEffectMono")
                  } else if activeFilter == "Noir" {
                      ciImage = ciImage.applyingFilter("CIPhotoEffectNoir")
                  } else if activeFilter == "Vivid" {
                      ciImage = ciImage.applyingFilter("CIColorControls", parameters: [kCIInputSaturationKey: 1.5, kCIInputContrastKey: 1.1])
                  } else if activeFilter == "Antigravity" {
                      ciImage = ciImage.applyingFilter("CIBumpDistortion", parameters: [
                          kCIInputCenterKey: CIVector(x: ciImage.extent.midX, y: ciImage.extent.midY),
                          kCIInputRadiusKey: 300.0,
                          kCIInputScaleKey: 0.5
                      ])
                  }

                  if let cgImage = context.createCGImage(ciImage, from: ciImage.extent) {
                      DispatchQueue.main.async {
                          self.currentFrame = cgImage
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > CleanApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.rahat.luminacamera</string>
              <key>CFBundleName</key>
              <string>LuminaCamera</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>NSCameraUsageDescription</key>
              <string>Lumina Camera needs camera access for live feed and filters.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Lumina Camera needs photo access to save captures.</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generate Clean Project
        run: |
          cat << 'EOF' > project.yml
          name: LuminaCamera
          options:
            bundleIdPrefix: com.rahat
            deploymentTarget:
              iOS: "17.0"
          targets:
            LuminaCamera:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: CleanApp
              info:
                path: CleanApp/Info.plist
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.rahat.luminacamera
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                GENERATE_INFOPLIST_FILE: NO
          EOF
          brew install xcodegen
          xcodegen generate

      - name: Build Application
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          xcodebuild build \
            -project LuminaCamera.xcodeproj \
            -scheme LuminaCamera \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r LuminaCamera.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaCamera-IPA
          path: LuminaCamera.ipa
