name: Build iOS App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Auto-Patch Code Mismatches
        run: |
          # 1. Global CGPoint Codable conformance
          cat << 'EOF' > Core/CGPointCodable.swift
          import Foundation
          import CoreGraphics

          extension CGPoint: @retroactive Codable {
              public init(from decoder: Decoder) throws {
                  var container = try decoder.unkeyedContainer()
                  let x = try container.decode(Double.self)
                  let y = try container.decode(Double.self)
                  self.init(x: x, y: y)
              }
              public func encode(to encoder: Encoder) throws {
                  var container = encoder.unkeyedContainer()
                  try container.encode(x)
                  try container.encode(y)
              }
          }
          EOF

          # 2. De-duplicate CameraMode and GridType across secondary files
          python3 -c "
          import os, re

          files_to_clean = [
              'UI/Components/ShutterButton.swift',
              'Models/PhotoData.swift',
              'UI/Camera/ModeSelector.swift',
              'UI/Camera/FocusIndicatorView.swift'
          ]

          for p in files_to_clean:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      txt = f.read()
                  # Remove duplicate enum bodies while preserving other code
                  txt = re.sub(r'public\s+enum\s+CameraMode[^{]*\{.*?\n\}', '', txt, flags=re.DOTALL)
                  txt = re.sub(r'enum\s+CameraMode[^{]*\{.*?\n\}', '', txt, flags=re.DOTALL)
                  txt = re.sub(r'public\s+enum\s+GridType[^{]*\{.*?\n\}', '', txt, flags=re.DOTALL)
                  txt = re.sub(r'enum\s+GridType[^{]*\{.*?\n\}', '', txt, flags=re.DOTALL)
                  with open(p, 'w') as f:
                      f.write(txt)
          "

          # 3. Ensure global managers have shared instances
          python3 -c "
          import os

          def ensure_shared(path, class_name):
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      c = f.read()
                  if 'static let shared' not in c and class_name in c:
                      c = c.replace(f'class {class_name}:', f'class {class_name}:\n    public static let shared = {class_name}()\n')
                      with open(path, 'w') as f:
                          f.write(c)

          ensure_shared('Managers/SettingsManager.swift', 'SettingsManager')
          ensure_shared('Managers/GalleryManager.swift', 'GalleryManager')
          ensure_shared('Managers/HapticManager.swift', 'HapticManager')
          "

      - name: Generate Clean Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: LuminaCamera
          options:
            bundleIdPrefix: com.rahat
            deploymentTarget:
              iOS: "17.0"
          targets:
            LuminaCamera:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: App
                - path: Core
                - path: Extensions
                - path: Managers
                - path: Models
                - path: Resources
                - path: UI
                - path: ViewModels
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.rahat.luminacamera
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
          EOF
          brew install xcodegen
          xcodegen generate

      - name: Build Application
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          xcodebuild build \
            -project LuminaCamera.xcodeproj \
            -scheme LuminaCamera \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r LuminaCamera.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaCamera-IPA
          path: LuminaCamera.ipa
