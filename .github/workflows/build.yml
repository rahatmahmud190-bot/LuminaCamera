name: Build iOS App
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Swift Duplicate Declarations
        run: |
          python3 -c "
          import os, re

          # 1. Remove duplicate CropRatio and FilterParameters from EditorViewModel.swift
          p_editor = 'ViewModels/EditorViewModel.swift'
          if os.path.exists(p_editor):
              with open(p_editor, 'r') as f:
                  content = f.read()
              content = re.sub(r'enum\s+CropRatio:[^{]*\{.*?\n\}', '', content, flags=re.DOTALL)
              content = re.sub(r'struct\s+FilterParameters:[^{]*\{.*?\n\}', '', content, flags=re.DOTALL)
              with open(p_editor, 'w') as f:
                  f.write(content)

          # 2. Remove duplicate GridType from GlassCard.swift
          p_glass = 'UI/Components/GlassCard.swift'
          if os.path.exists(p_glass):
              with open(p_glass, 'r') as f:
                  content = f.read()
              content = re.sub(r'public\s+enum\s+GridType[^{]*\{.*?\n\}', '', content, flags=re.DOTALL)
              content = re.sub(r'enum\s+GridType[^{]*\{.*?\n\}', '', content, flags=re.DOTALL)
              with open(p_glass, 'w') as f:
                  f.write(content)

          # 3. Clean ShutterButton & PhotoData duplicates
          for p in ['UI/Components/ShutterButton.swift', 'Models/PhotoData.swift']:
              if os.path.exists(p):
                  with open(p, 'r') as f:
                      content = f.read()
                  content = re.sub(r'enum\s+CameraMode[^{]*\{.*?\n\}', '', content, flags=re.DOTALL)
                  with open(p, 'w') as f:
                      f.write(content)

          # 4. Ensure GalleryManager has shared instance
          p_gal = 'Managers/GalleryManager.swift'
          if os.path.exists(p_gal):
              with open(p_gal, 'r') as f:
                  content = f.read()
              if 'static let shared' not in content:
                  content = re.sub(r'class\s+GalleryManager[^{]*\{', 'class GalleryManager: ObservableObject {\n    public static let shared = GalleryManager()\n', content)
                  with open(p_gal, 'w') as f:
                      f.write(content)
          "

      - name: Generate Clean Xcode Project
        run: |
          cat << 'EOF' > project.yml
          name: LuminaCamera
          options:
            bundleIdPrefix: com.rahat
            deploymentTarget:
              iOS: "17.0"
          targets:
            LuminaCamera:
              type: application
              platform: iOS
              deploymentTarget: "17.0"
              sources:
                - path: App
                - path: Core
                - path: Extensions
                - path: Managers
                - path: Models
                - path: Resources
                - path: UI
                - path: ViewModels
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.rahat.luminacamera
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
          EOF
          brew install xcodegen
          xcodegen generate

      - name: Build Application
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
        run: |
          xcodebuild build \
            -project LuminaCamera.xcodeproj \
            -scheme LuminaCamera \
            -configuration Debug \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/*.app Payload/
          zip -r LuminaCamera.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuminaCamera-IPA
          path: LuminaCamera.ipa
